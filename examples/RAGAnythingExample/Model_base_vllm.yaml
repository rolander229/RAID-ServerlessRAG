# template: vllm-modelserver | 更换部署模型时需要修改注释项
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  labels:
    app: vllm
data:
  model: "Qwen/Qwen3-1.7B" # 模型名称或路径
  port: "8000" # 监听端口
  served-model-name: "qwen3-1.7b" # 对外提供的模型名称
  host: "0.0.0.0"
  max-model-len: "4096"
  tensor-parallel-size: "1"
  gpu-memory-utilization: "0.9"
  max-num-seqs: "256"
  download-dir: "/root/.cache/huggingface/hub"
  hf-endpoint: "https://hf-mirror.com"
  dtype: "float16"
---
apiVersion: v1
kind: Secret
metadata:
  name: vllm-secrets
  labels:
    app: vllm
type: Opaque
stringData:
  api-key: "sk-vllm-api-key-123456" # VLLM API Key
  hf-token: "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" # 可以换成自己的Hugging Face Token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-pvc
  labels:
    app: vllm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deployment
  labels:
    app: vllm
    component: model-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      component: model-server
  template:
    metadata:
      labels:
        app: vllm
        component: model-server
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      nodeName: dell-65
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: vllm-model-pvc
      - name: dshm
        emptyDir:
          medium: Memory
      containers:
      - name: vllm-container
        image: gpu-harbor.act.buaa.edu.cn/user-liyilong/envd-vllm:0.8.5-cu12.6-rdma # 这是亦龙师兄的那个vllm:0.8.5+cuda镜像
        command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
        args:
        - "--model"
        - "$(MODEL)"
        - "--host"
        - "$(HOST)"
        - "--port"
        - "$(PORT)"
        - "--api-key"
        - "$(API_KEY)"
        - "--served-model-name"
        - "$(SERVED_MODEL_NAME)"
        - "--max-model-len"
        - "$(MAX_MODEL_LEN)"
        - "--tensor-parallel-size"
        - "$(TENSOR_PARALLEL_SIZE)"
        - "--gpu-memory-utilization"
        - "$(GPU_MEMORY_UTILIZATION)"
        - "--max-num-seqs"
        - "$(MAX_NUM_SEQS)"
        - "--download-dir"
        - "$(DOWNLOAD_DIR)"
        - "--dtype"
        - "$(DTYPE)"
        - "--worker-use-ray"
        - "false"
        - "--trust-remote-code"
        ports:
        - containerPort: 8000 # 容器端口
          name: http
          protocol: TCP
        env:
        - name: MODEL
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: model
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: host
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: port
        - name: SERVED_MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: served-model-name
        - name: MAX_MODEL_LEN
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: max-model-len
        - name: TENSOR_PARALLEL_SIZE
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: tensor-parallel-size
        - name: GPU_MEMORY_UTILIZATION
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: gpu-memory-utilization
        - name: MAX_NUM_SEQS
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: max-num-seqs
        - name: DOWNLOAD_DIR
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: download-dir
        - name: DTYPE
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: dtype
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-secrets
              key: api-key
        - name: HF_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: hf-endpoint
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: vllm-secrets
              key: hf-token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: vllm-secrets
              key: hf-token
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "1"
        - name: CUDA_LAUNCH_BLOCKING
          value: "1"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "spawn"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        resources:
          limits:
            nvidia.com/gpu: 1
          requests:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: model-storage
          mountPath: /root/.cache/huggingface
          subPath: huggingface
        - name: dshm
          mountPath: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  labels:
    app: vllm
    component: model-service
spec:
  selector:
    app: vllm
    component: model-server
  ports:
  - port: 8000 # 服务端口
    targetPort: 8000 # 容器端口
    name: http
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-nodeport
  labels:
    app: vllm
    component: nodeport-service
spec:
  selector:
    app: vllm
    component: model-server
  ports:
  - port: 8000 # 服务端口
    targetPort: 8000 # 容器端口
    nodePort: 30100 # 指定节点端口
  type: NodePort