# file: 50-difftest-job.yaml
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mopar-resnet50-difftest
  namespace: mopar-dev
  labels:
    mopar.io/model: resnet50
    mopar.io/role: difftest
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        mopar.io/model: resnet50
        mopar.io/role: difftest
    spec:
      restartPolicy: Never
      containers:
      - name: difftest
        image: harbor.example/mopar/difftest:0.1
        env:
        - name: MOPAR_ENDPOINT
          value: resnet50-slice-0.mopar-dev.svc:8080
        - name: MOPAR_MODEL
          value: resnet50
        - name: MOPAR_SLICES_COUNT
          value: '3'
        - name: MOPAR_DIFF_SAMPLES
          value: '100'
        - name: MOPAR_DIFF_TOLERANCE
          value: 1e-4
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: activations
          mountPath: /activations
        - name: weights
          mountPath: /models
          readOnly: true
      volumes:
      - name: activations
        persistentVolumeClaim:
          claimName: mopar-activations
      - name: weights
        persistentVolumeClaim:
          claimName: mopar-weights
