# file: 30-resnet50-slice-0.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resnet50-slice-0
  namespace: mopar-dev
  labels:
    mopar.io/model: resnet50
    mopar.io/slice-id: '0'
    mopar.io/role: orchestrator
    mopar.io/alloc-mb: '128'
  annotations:
    mopar.io/lambda-mb-per-vcpu: '1769'
spec:
  replicas: 1
  selector:
    matchLabels:
      mopar.io/model: resnet50
      mopar.io/slice-id: '0'
  template:
    metadata:
      labels:
        mopar.io/model: resnet50
        mopar.io/slice-id: '0'
        mopar.io/role: orchestrator
        mopar.io/alloc-mb: '128'
    spec:
      containers:
      - name: slice
        image: harbor.example/mopar/slice-runner:0.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: MOPAR_SLICE_ID
          value: '0'
        - name: MOPAR_OUT_PEERS
          value: resnet50-slice-1.mopar-dev.svc:8080
        - name: MOPAR_TRANSPORT
          value: dual
        - name: TORCH_HOME
          value: /models
        resources:
          requests:
            cpu: 1
            memory: 56Mi
          limits:
            memory: 947Mi
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: weights
          mountPath: /models
          readOnly: true
        - name: activations
          mountPath: /activations
        - name: plan
          mountPath: /app/plan
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        command:
        - python
        - -m
        - capsule.slice_server
        args:
        - --model
        - resnet50
        - --slice
        - '0'
        - --port
        - '8080'
        - --bind
        - 0.0.0.0
        - --plan
        - /app/plan/resnet50_manifest.json
        - --weights-dir
        - /models/resnet50
        - --activations-dir
        - /tmp/act
        - --log-dir
        - /tmp/logs
        - --device
        - cpu
        - --next-peer
        - http://resnet50-slice-1.mopar-dev.svc:8080/invoke
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: weights
        persistentVolumeClaim:
          claimName: mopar-weights
          readOnly: true
      - name: activations
        persistentVolumeClaim:
          claimName: mopar-activations
      - name: plan
        configMap:
          name: mopar-plan
