# file: 30-resnet50-slice-0.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resnet50-slice-0
  namespace: mopar-dev
  labels:
    mopar.io/model: resnet50
    mopar.io/slice-id: '0'
    mopar.io/role: orchestrator
    mopar.io/alloc-mb: '128'
  annotations:
    mopar.io/lambda-mb-per-vcpu: '1769'
spec:
  replicas: 1
  selector:
    matchLabels:
      mopar.io/model: resnet50
      mopar.io/slice-id: '0'
  template:
    metadata:
      labels:
        mopar.io/model: resnet50
        mopar.io/slice-id: '0'
        mopar.io/role: orchestrator
        mopar.io/alloc-mb: '128'
    spec:
      containers:
      - name: slice
        image: harbor.example/mopar/slice-runner:0.1
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: MOPAR_SLICE_ID
          value: '0'
        - name: MOPAR_OUT_PEERS
          value: resnet50-slice-1.mopar-dev.svc:8080
        - name: MOPAR_TRANSPORT
          value: dual
        resources:
          requests:
            cpu: 1m
            memory: 56Mi
          limits:
            memory: 947Mi
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: weights
          mountPath: /models
          readOnly: true
        - name: activations
          mountPath: /activations
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: weights
        persistentVolumeClaim:
          claimName: mopar-weights
          readOnly: true
      - name: activations
        persistentVolumeClaim:
          claimName: mopar-activations
---
apiVersion: v1
kind: Service
metadata:
  name: resnet50-slice-0
  namespace: mopar-dev
  labels:
    mopar.io/model: resnet50
    mopar.io/slice-id: '0'
    mopar.io/role: orchestrator
spec:
  type: ClusterIP
  selector:
    mopar.io/model: resnet50
    mopar.io/slice-id: '0'
  ports:
  - name: http
    port: 8080
    targetPort: 8080
